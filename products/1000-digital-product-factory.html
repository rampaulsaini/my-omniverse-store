<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>꙰ SHIRMANI Digital Product Factory</title>
<meta name="description" content="Interactive SHIRMANI factory product module. Each generated product exposes an engine-aware working surface before commercial publication.">
<style>
:root{--bg:#050403;--p:#110c07;--gold:#f1d27a;--amber:#e8934a;--text:#fff8ed;--muted:#b9a991;--green:#78e0a2;--blue:#9ec8ff;--line:rgba(241,210,122,.2)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#4b2d10 0,#090604 42%,#050403 100%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.6}.wrap{max-width:1050px;margin:auto;padding:18px 14px 70px}.hero,.panel{background:linear-gradient(145deg,rgba(24,17,8,.97),rgba(8,6,4,.97));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 70px rgba(0,0,0,.3)}.hero{text-align:center}.ey{color:var(--amber);letter-spacing:3px;font-size:.72rem}.hero h1{font-size:clamp(2rem,6vw,4rem);line-height:1.05;color:var(--gold);margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}.stat{padding:15px;border:1px solid var(--line);border-radius:13px}.stat b{display:block;color:var(--gold);font-size:.72rem;letter-spacing:1px}.stat span{color:var(--amber);font-size:1.05rem;font-weight:800}.code{font:700 .78rem ui-monospace,monospace;color:var(--blue)}.btn{display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;border:1px solid var(--line);color:var(--text);font-weight:800;margin:4px;cursor:pointer;background:transparent}.run{color:var(--green);border-color:rgba(120,224,162,.35)}.qc{padding:13px;border:1px dashed var(--line);margin:15px 0;color:var(--muted)}.work{margin-top:18px}.work label{display:block;color:var(--gold);font-weight:800;margin:10px 0 5px}.work textarea,.work input,.work select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#080604;color:var(--text);font:inherit}.out{white-space:pre-wrap;min-height:110px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#080604;color:#dff5e8;margin-top:12px}.canvasbox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.canvasbox canvas{display:block;max-width:100%;touch-action:none}.badge{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:.7rem;margin:3px;color:var(--muted)}.big{font-size:1.7rem;color:var(--gold);font-weight:900}
</style></head>
<body><main class="wrap">
<section class="hero"><div class="ey">꙰ SHIRMANI · FACTORY PRODUCTION</div><h1 id="title">Product Factory</h1><p id="intro" class="muted">Loading real factory product data…</p><div><a class="btn" href="../production-catalog.html">← Production Catalog</a><a class="btn" href="../supreme-marking-hub.html">Showroom</a><a class="btn" href="../funding.html">Funding / Progress</a></div></section>
<section id="meta" class="panel" style="margin-top:18px"></section>
<section id="workspace" class="panel work"><div class="muted">Interactive module loading…</div></section>
</main>
<script>
const RAW="https://raw.githubusercontent.com/rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-/main/generated/1000-digital-products.json";
const id=new URLSearchParams(location.search).get("id");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const meta=document.getElementById("meta"), work=document.getElementById("workspace");
let P=null;
function setOut(v){const o=document.getElementById("out");if(o)o.textContent=String(v);}
function textTool(){work.innerHTML='<div class="big">Text & Language Workspace</div><label>Input</label><textarea id="inp" rows="8" placeholder="अपना text यहाँ लिखें…"></textarea><div><button class="btn run" onclick="analyzeText()">Analyze / Transform</button></div><div id="out" class="out"></div>'}
function analyzeText(){const s=document.getElementById("inp").value;setOut("Characters: "+s.length+"\nWords: "+(s.trim()?s.trim().split(/\s+/).length:0)+"\nLines: "+(s?s.split(/\n/).length:0)+"\n\nPreview:\n"+s.slice(0,1200));}
function calcTool(){work.innerHTML='<div class="big">Counting & Math Workspace</div><label>Safe arithmetic expression</label><input id="inp" placeholder="e.g. 125*8+40/2"><div><button class="btn run" onclick="calc()">Calculate</button></div><div id="out" class="out"></div>'}
function calc(){const s=document.getElementById("inp").value.trim();if(!/^[0-9+\-*/().%\s]+$/.test(s)){setOut("Only numbers and arithmetic operators are allowed.");return}try{setOut(String(Function('"use strict";return ('+s+')')()))}catch(e){setOut("Expression error.")}}
function dataTool(){work.innerHTML='<div class="big">Data Tools Workspace</div><label>JSON / text data</label><textarea id="inp" rows="9" placeholder="{&quot;name&quot;:&quot;SHIRMANI&quot;}"></textarea><div><button class="btn run" onclick="formatData()">Format JSON</button><button class="btn" onclick="statsData()">Data Stats</button></div><div id="out" class="out"></div>'}
function formatData(){try{const x=JSON.parse(document.getElementById("inp").value);setOut(JSON.stringify(x,null,2))}catch(e){setOut("Valid JSON required.")}}
function statsData(){const s=document.getElementById("inp").value;try{const x=JSON.parse(s);setOut("Type: "+(Array.isArray(x)?"array":"object")+"\nKeys/items: "+(Array.isArray(x)?x.length:Object.keys(x).length))}catch(e){setOut("Valid JSON required.")}}
function timeTool(){work.innerHTML='<div class="big">Calendar & Time Workspace</div><label>Minutes</label><input id="inp" type="number" value="60"><div><button class="btn run" onclick="timeCalc()">Convert</button></div><div id="out" class="out"></div>'}
function timeCalc(){const n=Number(document.getElementById("inp").value)||0;setOut(n+" minutes = "+(n/60).toFixed(2)+" hours = "+(n/1440).toFixed(3)+" days");}
function seoTool(){work.innerHTML='<div class="big">SEO & Web Workspace</div><label>Page title</label><input id="t" value="'+esc(P?.name||"SHIRMANI Digital Product")+'"><label>Description</label><textarea id="d" rows="4">Premium digital product from the SHIRMANI production factory.</textarea><div><button class="btn run" onclick="seo()">Generate meta</button></div><div id="out" class="out"></div>'}
function seo(){const t=document.getElementById("t").value,d=document.getElementById("d").value;setOut('<title>'+t+'</title>\n<meta name="description" content="'+d.replace(/"/g,'&quot;')+'">');}
function commerceTool(){work.innerHTML='<div class="big">Commerce / Offer Workspace</div><label>Base price ₹</label><input id="p" type="number" value="193"><label>Discount %</label><input id="d" type="number" value="10"><div><button class="btn run" onclick="offer()">Create offer</button></div><div id="out" class="out"></div>'}
function offer(){const p=Number(document.getElementById("p").value)||0,d=Math.max(0,Math.min(100,Number(document.getElementById("d").value)||0)),n=p*(1-d/100);setOut("Base: ₹"+p.toFixed(2)+"\nDiscount: "+d+"%\nOffer price: ₹"+n.toFixed(2)+"\nSaving: ₹"+(p-n).toFixed(2));}
function quizTool(){work.innerHTML='<div class="big">Education Quiz Workspace</div><label>Question</label><input id="q" value="What does SHIRMANI production-first mean?"><label>Answer</label><input id="a" value="Research → Factory → Product → QC → Showroom"><div><button class="btn run" onclick="makeQuiz()">Create card</button></div><div id="out" class="out"></div>'}
function makeQuiz(){setOut("QUESTION\n"+document.getElementById("q").value+"\n\nANSWER\n"+document.getElementById("a").value)}
function drawTool(pixel=false){work.innerHTML='<div class="big">'+(pixel?"Pixel Art":"Sketch & Drawing")+' Workspace</div><p class="muted">Draw directly on the canvas.</p><div class="canvasbox"><canvas id="cv" width="800" height="420"></canvas></div><button class="btn run" onclick="clearCanvas()">Clear</button>';const c=document.getElementById("cv"),x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#111";x.lineWidth=pixel?10:3;let down=false;c.onpointerdown=e=>{down=true;x.beginPath();x.moveTo(e.offsetX,e.offsetY)};c.onpointerup=()=>down=false;c.onpointerleave=()=>down=false;c.onpointermove=e=>{if(!down)return;x.lineTo(e.offsetX,e.offsetY);x.stroke()};window.clearCanvas=()=>{x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}}
function gameTool(){work.innerHTML='<div class="big">Mini Game Workspace</div><p class="muted">Tap the target as many times as possible.</p><button class="btn run" id="target">TARGET</button><div id="out" class="out">Score: 0</div>';let s=0;document.getElementById("target").onclick=()=>{s++;setOut("Score: "+s+"\nKeep playing.")}}
function genericTool(){work.innerHTML='<div class="big">Interactive Product Workspace</div><p class="muted">This generated product has a live browser workspace. Use it as the starting product surface while the factory continues packaging the category-specific edition.</p><label>Workspace input</label><textarea id="inp" rows="8" placeholder="Enter your task, notes, idea or data…"></textarea><button class="btn run" onclick="genericRun()">Run module</button><div id="out" class="out"></div>'}
function genericRun(){const s=document.getElementById("inp").value;setOut("Module: "+(P?.name||"SHIRMANI")+'\nEngine: '+(P?.engine||"generic")+'\nInput received: '+s.length+' characters\n\nNext production action: package this workspace with a category-specific workflow, preview, offer and dispatch route.');}
function mount(){const e=String(P.engine||"").toLowerCase();if(e==="calculator")calcTool();else if(["text","nlp","ai","knowledge"].includes(e))textTool();else if(["data","files"].includes(e))dataTool();else if(e==="time")timeTool();else if(e==="seo")seoTool();else if(["commerce","marketing"].includes(e))commerceTool();else if(["quiz","education"].includes(e))quizTool();else if(e==="draw")drawTool(false);else if(e==="pixel")drawTool(true);else if(e==="game")gameTool();else genericTool();}
async function load(){try{const data=await fetch(RAW,{cache:"no-store"}).then(r=>r.json());P=(data.products||[]).find(x=>String(x.id)===String(id));if(!P){meta.innerHTML='<p>Product ID नहीं मिला। <a href="../production-catalog.html">Catalog पर लौटें</a></p>';work.innerHTML="";return}document.title="꙰ "+P.name+" — SHIRMANI Factory";document.getElementById("title").textContent=P.name;document.getElementById("intro").textContent="Interactive factory module · "+(P.family||"Digital Product")+" · "+(P.engine||"browser")+" engine";meta.innerHTML='<div class="grid"><div class="stat"><b>PRODUCT ID</b><span>'+esc(P.id)+'</span></div><div class="stat"><b>FAMILY</b><span>'+esc(P.family)+'</span></div><div class="stat"><b>ENGINE</b><span>'+esc(P.engine)+'</span></div><div class="stat"><b>FACTORY STATE</b><span>'+esc(P.status||"FACTORY_READY")+'</span></div></div><div class="qc"><strong>QC / Release gate</strong><br>Product: '+esc(P.id)+' · Factory: '+esc(P.status||"FACTORY_READY")+' · Commercial: '+esc(P.commercial_status||"NOT_SOLD")+'<br>Public sale is reserved for products with a real package, customer route and dispatch path.</div>';mount()}catch(e){meta.innerHTML='<p>Factory data अभी उपलब्ध नहीं है। बाद में पुनः प्रयास करें।</p>'}}
load();
</script></body></html>
