name: Supreme Multi-Layer Production Automission
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supreme-multi-layer-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Institute → Factory production queue
        env:
          RAW: https://raw.githubusercontent.com/rampaulsaini/Shirmani-Research-Institute-Shirmani-Research-Institute-/main/generated/1000-digital-products.json
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from datetime import datetime, timezone

          raw=os.environ["RAW"]
          data=json.load(urllib.request.urlopen(raw, timeout=30))
          products=data.get("products", [])
          published=json.load(open("data/public-production-manifest.json", encoding="utf-8")).get("products", [])

          family=Counter(p.get("family","UNKNOWN") for p in products)
          engine=Counter(p.get("engine","UNKNOWN") for p in products)
          status=Counter(p.get("status","UNKNOWN") for p in products)
          commercial=Counter(p.get("commercial_status","UNKNOWN") for p in products)

          queue=[]
          for p in products:
              if p.get("commercial_status") != "SOLD":
                  queue.append({
                    "id":p.get("id"),
                    "name":p.get("name"),
                    "family":p.get("family"),
                    "engine":p.get("engine"),
                    "stage":"FACTORY_READY",
                    "next_stage":"PRODUCT_PACKAGE",
                    "commercial_status":p.get("commercial_status","UNKNOWN"),
                    "public_route":p.get("access")
                  })

          out={
            "schema_version":"2.0",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "principle":"production-first",
            "pipeline":["INSTITUTE_DISCOVERY","FACTORY_PRODUCTION","PRODUCT_PACKAGE","QC_GATE","PUBLIC_SHOWROOM","SALE","REVIEW_FEEDBACK","QUALITY_IMPROVEMENT"],
            "counts":{
              "factory_modes":len(products),
              "published_products":len(published),
              "production_candidates":len(queue),
              "families":len(family),
              "engines":len(engine)
            },
            "factory_status":dict(status),
            "commercial_status":dict(commercial),
            "family_counts":dict(sorted(family.items())),
            "engine_counts":dict(sorted(engine.items())),
            "published_ids":[p.get("id") for p in published],
            "next_action":"Convert highest-value runnable modes into complete product packages with real preview/access, description, price, offer, QC/QR and dispatch route; do not fabricate inventory.",
            "queue_sample":queue[:120]
          }
          os.makedirs("data",exist_ok=True)
          # Materialize a concrete public product-package record for every catalog entry.
          # The package points to the existing runnable factory workspace; it is not a placeholder-only card.
          sale_by_id={p.get("id"):p for p in published}
          packages=[]
          for p in products:
              pid=p.get("id")
              family=p.get("family","Digital Tools")
              engine=p.get("engine","generic")
              published_item=sale_by_id.get(pid)
              package={
                "id":pid,
                "name":p.get("name"),
                "family":family,
                "engine":engine,
                "stage":"PRODUCT_PACKAGE",
                "module_type":"RUNNABLE_FACTORY_MODE",
                "module_url":"https://rampaulsaini.github.io/Shirmani-Research-Institute-Shirmani-Research-Institute-/products/1000-digital-product-factory.html?id="+str(pid),
                "short_description":p.get("short_description") or ("कार्यशील "+family+" digital product — "+engine+" engine."),
                "long_description_route":"https://rampaulsaini.github.io/Shirmani-Research-Institute-Shirmani-Research-Institute-/products/1000-digital-product-factory.html?id="+str(pid),
                "qr_route":"https://rampaulsaini.github.io/Shirmani-Research-Institute-Shirmani-Research-Institute-/products/1000-digital-product-factory.html?id="+str(pid),
                "visual_identity_seed":str(pid)+"|"+family+"|"+engine,
                "price_inr":(published_item or {}).get("price_inr") or (89 if engine in {"calculator","text","data","time","files"} else 193),
                "offer_status":"NOT_CONFIGURED",
                "qc_gate":"QC-PROD-"+str(pid),
                "dispatch":"NO",
                "sale_status":"PUBLISHED" if published_item else "NOT_PUBLISHED",
                "source_status":p.get("status","UNKNOWN")
              }
              packages.append(package)
          with open("data/product-packages.json","w",encoding="utf-8") as f:
              json.dump({"schema_version":"1.0","generated_at_utc":datetime.now(timezone.utc).isoformat(),"principle":"production-first","count":len(packages),"packages":packages},f,ensure_ascii=False,indent=2)
              f.write("\n")
          with open("data/production-queue.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write("\n")
          with open("data/production-heartbeat.json","w",encoding="utf-8") as f:
              hb={
                "schema_version":"2.0",
                "purpose":"continuous production-first showroom heartbeat",
                "source":raw,
                "product_count":len(products),
                "family_count":len(family),
                "engine_count":len(engine),
                "status_counts":dict(status),
                "commercial_status_counts":dict(commercial),
                "published_product_count":len(published),
                "production_candidate_count":len(queue),
                "showroom_route":"supreme-public-showroom.html",
                "updated_at_utc":datetime.now(timezone.utc).isoformat()
              }
              json.dump(hb,f,ensure_ascii=False,indent=2); f.write("\n")
          PY

      - name: Publish visible production state
        run: |
          git config user.name "SHIRMANI Production Automission"
          git config user.email "actions@users.noreply.github.com"
          git add data/production-queue.json data/production-heartbeat.json data/product-packages.json
          git diff --cached --quiet || git commit -m "chore: advance multi-layer production queue"
          git push
